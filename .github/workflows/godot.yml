name: Godot regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Run regression
        run: GODOT=/tmp/godot/Godot_v4.3-stable_linux.x86_64 bash tests/run_all.sh
      - name: Capture running presentation
        run: |
          mkdir -p .artifacts/logs
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/godot/Godot_v4.3-stable_linux.x86_64 --audio-driver Dummy --path "$PWD" --script res://tests/capture.gd
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: .artifacts/logs/
      - name: Install Windows export template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -j -q /tmp/templates.tpz templates/windows_release_x86_64.exe -d "$HOME/.local/share/godot/export_templates/4.3.stable"
      - name: Export Windows playable
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path "$PWD" --export-release "Windows Desktop" build/TheLastEmporium.exe
          test -s build/TheLastEmporium.exe
          test -s build/TheLastEmporium.pck
          ls -lh build
      - name: Upload Windows playable
        uses: actions/upload-artifact@v4
        with:
          name: TheLastEmporium-Windows-GateD1
          path: build/
